<!DOCTYPE html>

<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>password</title>

<link rel="stylesheet" href="../../style.css">

<!-- google fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Noto+Sans+JP&display=swap" rel="stylesheet">


</head>

<body>

<header>
    <h1>N.O.</h1>
    <a href="../../index.html">ホームに戻る</a>
</header>

<h2>パスワードを入力してください</h2>

<input type="password" id="password" placeholder="パスワード">

<button onclick="checkPassword()">送信</button>

<p id="message"></p>

<script>
    function checkPassword() {

        const password = document.getElementById("password").value;

        const correctPassword = "ononami";

        if (password === correctPassword) {
            window.location.href = "N.O.html";
        } else {
            document.getElementById("message").textContent =
                "パスワードが違います。";
        }
    }
</script>

</body>
</html>
